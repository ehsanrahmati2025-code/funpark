<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | فان‌پارک</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { font-family: Vazirmatn, Tahoma, sans-serif; }
  body { background: #f8fafc; }
  .gradient-bg { background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%); }
  .sidebar-item { transition: all .2s; }
  .sidebar-item:hover { background: rgba(124,58,237,.1); }
  .sidebar-item.active { background: linear-gradient(90deg, rgba(124,58,237,.15), transparent); border-right: 3px solid #7c3aed; font-weight: 700; color: #7c3aed; }
  .stat-card { transition: all .3s; }
  .stat-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,.1); }
  table tbody tr:hover { background: #f9fafb; }
  .modal-backdrop { background: rgba(15,23,42,.6); backdrop-filter: blur(4px); }
  .toast { animation: slideIn .3s ease; }
  @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input, select { font-family: Vazirmatn; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .loading { opacity: .6; pointer-events: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge-green { background: #dcfce7; color: #166534; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-yellow { background: #fef3c7; color: #92400e; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-gray { background: #f1f5f9; color: #475569; }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center gradient-bg p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="text-6xl mb-4">🎡</div>
      <h1 class="text-3xl font-black text-slate-800">فان‌پارک</h1>
      <p class="text-slate-500 mt-1">ورود به پنل مدیریت</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">نام کاربری</label>
        <input id="loginUsername" type="text" dir="ltr" autocomplete="username"
          placeholder="admin"
          class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-purple-500 focus:outline-none text-left">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">رمز عبور</label>
        <input id="loginPassword" type="password" autocomplete="current-password"
          placeholder="••••••••"
          class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-purple-500 focus:outline-none">
      </div>
      <button onclick="doLogin()" id="loginBtn"
        class="w-full gradient-bg text-white py-3 rounded-xl font-bold text-lg hover:opacity-90 transition">
        ورود به پنل
      </button>
      <p id="loginError" class="text-red-600 text-sm text-center hidden"></p>
    </div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" class="hidden min-h-screen flex">

  <aside class="w-64 bg-white border-l border-slate-200 flex flex-col fixed h-full z-30">
    <div class="p-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎡</span>
        <div>
          <h1 class="font-black text-slate-800">فان‌پارک</h1>
          <p class="text-xs text-slate-400">پنل مدیریت</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <a href="#" data-page="dashboard" class="sidebar-item active flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">📊</span><span>داشبورد</span>
      </a>
      <a href="#" data-page="events" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">🎢</span><span>رویدادها</span>
      </a>
      <a href="#" data-page="orders" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">🛒</span><span>سفارش‌ها</span>
      </a>
      <a href="#" data-page="tickets" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">🎫</span><span>بلیط‌ها</span>
      </a>
      <a href="#" data-page="users" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">👥</span><span>کاربران</span>
      </a>
      <a href="#" data-page="devices" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">📡</span><span>دستگاه‌ها</span>
      </a>
      <a href="#" data-page="scans" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600">
        <span class="text-xl">📋</span><span>لاگ اسکن</span>
      </a>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition">
        <span class="text-xl">🚪</span><span>خروج</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 mr-64">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between sticky top-0 z-20">
      <h2 id="pageTitle" class="text-2xl font-black text-slate-800">داشبورد</h2>
      <div class="flex items-center gap-3">
        <button onclick="refreshCurrentPage()" class="text-slate-500 hover:text-purple-600 transition text-2xl" title="بروزرسانی">🔄</button>
        <div class="w-10 h-10 rounded-full gradient-bg flex items-center justify-center text-white font-bold">م</div>
      </div>
    </header>

    <div id="pageContent" class="p-8"></div>
  </main>
</div>

<div id="toastContainer" class="fixed bottom-6 left-6 space-y-2 z-50"></div>

<script>
// ============= CONFIG =============
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxzfJzgcw1fZGzGHbrOOT6BnaGMGAbvqQ4uMFFyyPrkWy1d6udSzy8Z865lGJsBkwz4/exec';

// ============= STATE =============
const state = {
  url: GAS_URL,
  token: localStorage.getItem('funpark_admin_token') || '',
  currentPage: 'dashboard',
  cache: {},
};

// ============= API =============
async function api(action, body = {}) {
  const res = await fetch(state.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: state.token, ...body }),
  });
  const json = await res.json();
  if (json.status >= 400) throw new Error(json.data.error || 'خطای API');
  return json.data;
}

// ============= TOAST =============
function toast(msg, type = 'success') {
  const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-yellow-500' };
  const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 font-bold`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ============= FORMAT =============
function fmtNum(n) { return Number(n || 0).toLocaleString('fa-IR'); }
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleString('fa-IR'); } catch { return d; }
}
function fmtRial(n) { return fmtNum(n) + ' ریال'; }

// ============= LOGIN =============
async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errEl.classList.add('hidden');
  if (!username || !password) {
    errEl.textContent = 'نام کاربری و رمز عبور را وارد کنید';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'در حال ورود...';

  try {
    const res = await api('admin.login', { username, password });
    state.token = res.token;
    localStorage.setItem('funpark_admin_token', res.token);
    showDashboard();
    toast('خوش آمدید');
  } catch (e) {
    errEl.textContent = e.message || 'خطا در ورود';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ورود به پنل';
  }
}

document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('loginUsername').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});

function logout() {
  state.token = '';
  localStorage.removeItem('funpark_admin_token');
  location.reload();
}

function showDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  navigate('dashboard');
}

// ============= NAVIGATION =============
document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    navigate(el.dataset.page);
  });
});

async function navigate(page) {
  state.currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('pageTitle').textContent = {
    dashboard: 'داشبورد', events: 'مدیریت رویدادها', orders: 'سفارش‌ها',
    tickets: 'بلیط‌ها', users: 'کاربران', devices: 'دستگاه‌ها', scans: 'لاگ اسکن',
  }[page];

  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="flex justify-center py-20"><div class="spinner w-12 h-12 border-4 border-purple-200 border-t-purple-600 rounded-full"></div></div>';

  try {
    if (page === 'dashboard') await renderDashboard();
    else if (page === 'events') await renderEvents();
    else if (page === 'orders') await renderOrders();
    else if (page === 'tickets') await renderTickets();
    else if (page === 'users') await renderUsers();
    else if (page === 'devices') await renderDevices();
    else if (page === 'scans') await renderScans();
  } catch (e) {
    content.innerHTML = `<div class="bg-red-50 border-2 border-red-200 text-red-700 p-6 rounded-2xl">
      <div class="font-bold mb-1">خطا در بارگذاری</div>
      <div class="text-sm">${e.message}</div>
    </div>`;
  }
}

function refreshCurrentPage() { navigate(state.currentPage); }

// ============= DASHBOARD =============
async function renderDashboard() {
  const [stats, chart] = await Promise.all([
    api('admin.stats'),
    api('admin.sales.chart').catch(() => ({ labels: [], counts: [], revenue: [] })),
  ]);

  const cards = [
    { label: 'درآمد کل', value: fmtRial(stats.revenue_rial), icon: '💰', color: 'from-green-500 to-emerald-600' },
    { label: 'سفارش موفق', value: fmtNum(stats.orders_paid), icon: '🛒', color: 'from-blue-500 to-indigo-600' },
    { label: 'بلیط صادرشده', value: fmtNum(stats.tickets_total), icon: '🎫', color: 'from-purple-500 to-pink-600' },
    { label: 'کاربران', value: fmtNum(stats.users), icon: '👥', color: 'from-orange-500 to-red-500' },
    { label: 'رویداد فعال', value: `${stats.events_active} / ${stats.events_total}`, icon: '🎢', color: 'from-cyan-500 to-blue-600' },
    { label: 'دستگاه فعال', value: fmtNum(stats.devices_active), icon: '📡', color: 'from-indigo-500 to-purple-600' },
    { label: 'کل اسکن‌ها', value: fmtNum(stats.scans_total), icon: '📋', color: 'from-slate-500 to-slate-700' },
    { label: 'بلیط استفاده‌شده', value: fmtNum(stats.tickets_used), icon: '✅', color: 'from-teal-500 to-cyan-600' },
  ];

  document.getElementById('pageContent').innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-8">
      ${cards.map(c => `
        <div class="stat-card bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-3xl">${c.icon}</span>
            <div class="w-2 h-2 rounded-full bg-gradient-to-r ${c.color}"></div>
          </div>
          <p class="text-xs text-slate-500 mt-3">${c.label}</p>
          <p class="text-2xl font-black text-slate-800 mt-1">${c.value}</p>
        </div>
      `).join('')}
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h3 class="font-black text-slate-800 mb-4">📈 فروش ۱۴ روز اخیر</h3>
        <div style="height:280px"><canvas id="chartSales"></canvas></div>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h3 class="font-black text-slate-800 mb-4">📊 تعداد سفارش‌ها</h3>
        <div style="height:280px"><canvas id="chartOrders"></canvas></div>
      </div>
    </div>
  `;

  new Chart(document.getElementById('chartSales'), {
    type: 'line',
    data: {
      labels: chart.labels,
      datasets: [{ label: 'درآمد', data: chart.revenue,
        borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,.1)',
        fill: true, tension: .4, borderWidth: 3 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  new Chart(document.getElementById('chartOrders'), {
    type: 'bar',
    data: {
      labels: chart.labels,
      datasets: [{ label: 'تعداد', data: chart.counts,
        backgroundColor: 'rgba(219,39,119,.7)', borderRadius: 8 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

// ============= EVENTS =============
async function renderEvents() {
  const { events } = await api('admin.events.list');
  state.cache.events = events;

  document.getElementById('pageContent').innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <div class="text-slate-500 text-sm">${events.length} رویداد</div>
      <button onclick="openEventModal()" class="gradient-bg text-white px-5 py-2.5 rounded-xl font-bold hover:opacity-90 transition">➕ رویداد جدید</button>
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3 text-right font-bold">عنوان</th>
            <th class="px-4 py-3 text-right font-bold">slug</th>
            <th class="px-4 py-3 text-right font-bold">قیمت</th>
            <th class="px-4 py-3 text-right font-bold">ظرفیت</th>
            <th class="px-4 py-3 text-right font-bold">وضعیت</th>
            <th class="px-4 py-3 text-right font-bold">عملیات</th>
          </tr>
        </thead>
        <tbody>
          ${events.map(ev => `
            <tr class="border-t border-slate-100">
              <td class="px-4 py-3 font-bold text-slate-800">${ev.title || '—'}</td>
              <td class="px-4 py-3 text-slate-500 font-mono text-xs" dir="ltr">${ev.slug || '—'}</td>
              <td class="px-4 py-3">${fmtRial(ev.price_rial)}</td>
              <td class="px-4 py-3">${fmtNum(ev.capacity)}</td>
              <td class="px-4 py-3">
                <span class="badge ${String(ev.active).toUpperCase() === 'TRUE' ? 'badge-green' : 'badge-gray'}">
                  ${String(ev.active).toUpperCase() === 'TRUE' ? 'فعال' : 'غیرفعال'}
                </span>
              </td>
              <td class="px-4 py-3">
                <button onclick="openEventModal('${ev.id}')" class="text-blue-600 hover:underline font-bold">ویرایش</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${events.length === 0 ? '<div class="text-center py-12 text-slate-400">رویدادی وجود ندارد</div>' : ''}
    </div>
  `;
}

function openEventModal(id) {
  const ev = id ? state.cache.events.find(e => e.id === id) : {};
  const isEdit = !!id;
  const el = document.createElement('div');
  el.className = 'modal-backdrop fixed inset-0 z-40 flex items-center justify-center p-4';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-black mb-5">${isEdit ? 'ویرایش رویداد' : 'رویداد جدید'}</h3>
      <div class="space-y-4">
        <div>
          <label class="text-sm font-bold">عنوان</label>
          <input id="ev_title" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl" value="${ev.title || ''}">
        </div>
        <div>
          <label class="text-sm font-bold">slug (یکتا، انگلیسی)</label>
          <input id="ev_slug" dir="ltr" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl text-left" value="${ev.slug || ''}">
        </div>
        <div>
          <label class="text-sm font-bold">توضیحات</label>
          <textarea id="ev_desc" rows="2" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl">${ev.description || ''}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm font-bold">قیمت (ریال)</label>
            <input id="ev_price" type="number" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl" value="${ev.price_rial || 0}">
          </div>
          <div>
            <label class="text-sm font-bold">ظرفیت</label>
            <input id="ev_cap" type="number" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl" value="${ev.capacity || 100}">
          </div>
        </div>
        <div>
          <label class="text-sm font-bold">مکان</label>
          <input id="ev_loc" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl" value="${ev.location || ''}">
        </div>
        <div>
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="ev_active" type="checkbox" ${String(ev.active).toUpperCase() === 'TRUE' ? 'checked' : ''}>
            <span class="text-sm font-bold">فعال</span>
          </label>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="saveEvent('${id || ''}')" class="gradient-bg text-white px-6 py-2.5 rounded-xl font-bold flex-1">ذخیره</button>
        <button onclick="this.closest('.modal-backdrop').remove()" class="bg-slate-100 text-slate-700 px-6 py-2.5 rounded-xl font-bold">انصراف</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
}

async function saveEvent(id) {
  const event = {
    id: id || undefined,
    title: document.getElementById('ev_title').value.trim(),
    slug: document.getElementById('ev_slug').value.trim(),
    description: document.getElementById('ev_desc').value.trim(),
    price_rial: parseInt(document.getElementById('ev_price').value) || 0,
    capacity: parseInt(document.getElementById('ev_cap').value) || 0,
    location: document.getElementById('ev_loc').value.trim(),
    active: document.getElementById('ev_active').checked,
  };
  try {
    await api('admin.events.save', { event });
    toast('ذخیره شد');
    document.querySelector('.modal-backdrop').remove();
    renderEvents();
  } catch (e) { toast(e.message, 'error'); }
}

// ============= ORDERS =============
async function renderOrders() {
  const { orders } = await api('admin.orders.list');
  state.cache.orders = orders;

  const statusBadge = (s) => ({
    paid: '<span class="badge badge-green">پرداخت‌شده</span>',
    pending: '<span class="badge badge-yellow">در انتظار</span>',
    failed: '<span class="badge badge-red">ناموفق</span>',
  }[s] || `<span class="badge badge-gray">${s}</span>`);

  document.getElementById('pageContent').innerHTML = `
    <div class="mb-6 flex items-center justify-between">
      <div class="text-slate-500 text-sm">${orders.length} سفارش</div>
      <input id="orderSearch" placeholder="🔍 جستجو..." oninput="filterTable('ordersTable')"
        class="px-4 py-2 border-2 border-slate-200 rounded-xl w-64">
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table id="ordersTable" class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3 text-right font-bold">کاربر</th>
            <th class="px-4 py-3 text-right font-bold">رویداد</th>
            <th class="px-4 py-3 text-right font-bold">تعداد</th>
            <th class="px-4 py-3 text-right font-bold">مبلغ</th>
            <th class="px-4 py-3 text-right font-bold">وضعیت</th>
            <th class="px-4 py-3 text-right font-bold">تاریخ</th>
          </tr>
        </thead>
        <tbody>
          ${orders.map(o => `
            <tr class="border-t border-slate-100">
              <td class="px-4 py-3">
                <div class="font-bold text-slate-800">${o.user_name}</div>
                <div class="text-xs text-slate-400" dir="ltr">${o.user_phone}</div>
              </td>
              <td class="px-4 py-3">${o.event_title}</td>
              <td class="px-4 py-3">${fmtNum(o.quantity)}</td>
              <td class="px-4 py-3 font-bold">${fmtRial(o.total_rial)}</td>
              <td class="px-4 py-3">${statusBadge(o.status)}</td>
              <td class="px-4 py-3 text-xs text-slate-500">${fmtDate(o.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${orders.length === 0 ? '<div class="text-center py-12 text-slate-400">سفارشی وجود ندارد</div>' : ''}
    </div>
  `;
}

// ============= TICKETS =============
async function renderTickets() {
  const { tickets } = await api('admin.tickets.list');
  state.cache.tickets = tickets;

  const statusBadge = (s) => ({
    issued: '<span class="badge badge-blue">صادرشده</span>',
    partially_used: '<span class="badge badge-yellow">استفاده جزئی</span>',
    used: '<span class="badge badge-gray">استفاده‌شده</span>',
    cancelled: '<span class="badge badge-red">لغو‌شده</span>',
  }[s] || `<span class="badge badge-gray">${s}</span>`);

  document.getElementById('pageContent').innerHTML = `
    <div class="mb-6 flex items-center justify-between">
      <div class="text-slate-500 text-sm">${tickets.length} بلیط</div>
      <input id="ticketSearch" placeholder="🔍 جستجو..." oninput="filterTable('ticketsTable')"
        class="px-4 py-2 border-2 border-slate-200 rounded-xl w-64">
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table id="ticketsTable" class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3 text-right font-bold">سریال</th>
            <th class="px-4 py-3 text-right font-bold">کاربر</th>
            <th class="px-4 py-3 text-right font-bold">رویداد</th>
            <th class="px-4 py-3 text-right font-bold">اعتبار</th>
            <th class="px-4 py-3 text-right font-bold">وضعیت</th>
            <th class="px-4 py-3 text-right font-bold">عملیات</th>
          </tr>
        </thead>
        <tbody>
          ${tickets.map(t => `
            <tr class="border-t border-slate-100">
              <td class="px-4 py-3 font-mono font-bold" dir="ltr">${t.serial_number}</td>
              <td class="px-4 py-3">
                <div class="font-bold">${t.user_name}</div>
                <div class="text-xs text-slate-400" dir="ltr">${t.user_phone}</div>
              </td>
              <td class="px-4 py-3">${t.event_title}</td>
              <td class="px-4 py-3">${t.remaining_credits} / ${t.total_credits}</td>
              <td class="px-4 py-3">${statusBadge(t.status)}</td>
              <td class="px-4 py-3">
                ${t.status !== 'cancelled' && t.status !== 'used' ?
                  `<button onclick="revokeTicket('${t.id}')" class="text-red-600 hover:underline font-bold text-xs">لغو</button>` : '—'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${tickets.length === 0 ? '<div class="text-center py-12 text-slate-400">بلیطی وجود ندارد</div>' : ''}
    </div>
  `;
}

async function revokeTicket(id) {
  if (!confirm('بلیط لغو شود؟')) return;
  try {
    await api('admin.tickets.revoke', { id });
    toast('بلیط لغو شد');
    renderTickets();
  } catch (e) { toast(e.message, 'error'); }
}

// ============= USERS =============
async function renderUsers() {
  const { users } = await api('admin.users.list');
  document.getElementById('pageContent').innerHTML = `
    <div class="mb-6 text-slate-500 text-sm">${users.length} کاربر</div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3 text-right font-bold">نام</th>
            <th class="px-4 py-3 text-right font-bold">موبایل</th>
            <th class="px-4 py-3 text-right font-bold">ایمیل</th>
            <th class="px-4 py-3 text-right font-bold">تاریخ عضویت</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr class="border-t border-slate-100">
              <td class="px-4 py-3 font-bold">${u.full_name || '—'}</td>
              <td class="px-4 py-3 font-mono" dir="ltr">${u.phone}</td>
              <td class="px-4 py-3 text-slate-500">${u.email || '—'}</td>
              <td class="px-4 py-3 text-xs text-slate-500">${fmtDate(u.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${users.length === 0 ? '<div class="text-center py-12 text-slate-400">کاربری وجود ندارد</div>' : ''}
    </div>
  `;
}

// ============= DEVICES =============
async function renderDevices() {
  const { devices } = await api('admin.devices.list');
  state.cache.devices = devices;

  document.getElementById('pageContent').innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <div class="text-slate-500 text-sm">${devices.length} دستگاه</div>
      <button onclick="openDeviceModal()" class="gradient-bg text-white px-5 py-2.5 rounded-xl font-bold hover:opacity-90 transition">➕ دستگاه جدید</button>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
      ${devices.map(d => `
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <span class="text-3xl">📡</span>
            <span class="badge ${String(d.active).toUpperCase() === 'TRUE' ? 'badge-green' : 'badge-gray'}">
              ${String(d.active).toUpperCase() === 'TRUE' ? 'فعال' : 'غیرفعال'}
            </span>
          </div>
          <h3 class="font-black text-slate-800">${d.name}</h3>
          <p class="text-xs text-slate-500 mt-1">📍 ${d.location || '—'}</p>
          <p class="text-xs text-slate-400 mt-1 font-mono" dir="ltr">ID: ${d.id}</p>
          <p class="text-xs text-slate-400 mt-1">آخرین اتصال: ${fmtDate(d.last_seen_at)}</p>
          <div class="flex gap-2 mt-4">
            <button onclick="openDeviceModal('${d.id}')" class="flex-1 text-blue-600 border border-blue-200 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-50">ویرایش</button>
            <button onclick="rotateDeviceKey('${d.id}')" class="flex-1 text-orange-600 border border-orange-200 py-1.5 rounded-lg text-sm font-bold hover:bg-orange-50">کلید جدید</button>
          </div>
        </div>
      `).join('')}
    </div>
    ${devices.length === 0 ? '<div class="text-center py-12 text-slate-400">دستگاهی وجود ندارد</div>' : ''}
  `;
}

function openDeviceModal(id) {
  const d = id ? state.cache.devices.find(x => x.id === id) : {};
  const isEdit = !!id;
  const el = document.createElement('div');
  el.className = 'modal-backdrop fixed inset-0 z-40 flex items-center justify-center p-4';
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.innerHTML = `
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6">
      <h3 class="text-xl font-black mb-5">${isEdit ? 'ویرایش دستگاه' : 'دستگاه جدید'}</h3>
      <div class="space-y-4">
        <div>
          <label class="text-sm font-bold">شناسه (ID، انگلیسی)</label>
          <input id="dv_id" dir="ltr" ${isEdit ? 'disabled' : ''} class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl text-left disabled:bg-slate-100" value="${d.id || ''}">
        </div>
        <div>
          <label class="text-sm font-bold">نام</label>
          <input id="dv_name" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl" value="${d.name || ''}">
        </div>
        <div>
          <label class="text-sm font-bold">مکان</label>
          <input id="dv_loc" class="w-full mt-1 px-4 py-2 border-2 border-slate-200 rounded-xl" value="${d.location || ''}">
        </div>
        <div>
          <label class="flex items-center gap-2 cursor-pointer">
            <input id="dv_active" type="checkbox" ${String(d.active).toUpperCase() === 'TRUE' || !isEdit ? 'checked' : ''}>
            <span class="text-sm font-bold">فعال</span>
          </label>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="saveDevice('${id || ''}')" class="gradient-bg text-white px-6 py-2.5 rounded-xl font-bold flex-1">ذخیره</button>
        <button onclick="this.closest('.modal-backdrop').remove()" class="bg-slate-100 text-slate-700 px-6 py-2.5 rounded-xl font-bold">انصراف</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
}

async function saveDevice(id) {
  const device = {
    id: document.getElementById('dv_id').value.trim(),
    name: document.getElementById('dv_name').value.trim(),
    location: document.getElementById('dv_loc').value.trim(),
    active: document.getElementById('dv_active').checked,
  };
  try {
    const res = await api('admin.devices.save', { device });
    document.querySelector('.modal-backdrop').remove();
    if (res.api_key) showKeyModal(res.api_key);
    else toast(res.message || 'ذخیره شد');
    renderDevices();
  } catch (e) { toast(e.message, 'error'); }
}

async function rotateDeviceKey(id) {
  if (!confirm('کلید جدید تولید شود؟ کلید قدیمی باطل می‌شود.')) return;
  const d = state.cache.devices.find(x => x.id === id);
  try {
    const res = await api('admin.devices.save', {
      device: { id, name: d.name, location: d.location, active: d.active },
      rotateKey: true
    });
    if (res.api_key) showKeyModal(res.api_key);
  } catch (e) { toast(e.message, 'error'); }
}

function showKeyModal(key) {
  const el = document.createElement('div');
  el.className = 'modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4';
  el.innerHTML = `
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 text-center">
      <div class="text-5xl mb-3">🔑</div>
      <h3 class="text-xl font-black mb-2">کلید API دستگاه</h3>
      <p class="text-red-600 text-sm mb-4 font-bold">این کلید فقط یک بار نمایش داده می‌شود. همین حالا کپی کنید.</p>
      <div class="bg-slate-100 p-4 rounded-xl font-mono text-sm break-all" dir="ltr">${key}</div>
      <div class="flex gap-3 mt-6">
        <button onclick="navigator.clipboard.writeText('${key}'); toast('کپی شد');" class="gradient-bg text-white px-6 py-2.5 rounded-xl font-bold flex-1">📋 کپی</button>
        <button onclick="this.closest('.modal-backdrop').remove()" class="bg-slate-100 text-slate-700 px-6 py-2.5 rounded-xl font-bold">بستن</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
}

// ============= SCANS =============
async function renderScans() {
  const { logs } = await api('admin.scanlogs.list');
  document.getElementById('pageContent').innerHTML = `
    <div class="mb-6 flex items-center justify-between">
      <div class="text-slate-500 text-sm">${logs.length} لاگ (آخرین ۲۰۰)</div>
      <label class="flex items-center gap-2 cursor-pointer text-sm font-bold text-slate-600">
        <input type="checkbox" id="autoRefresh" class="rounded">
        بروزرسانی خودکار (۱۰ ثانیه)
      </label>
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-600">
          <tr>
            <th class="px-4 py-3 text-right font-bold">سریال بلیط</th>
            <th class="px-4 py-3 text-right font-bold">دستگاه</th>
            <th class="px-4 py-3 text-right font-bold">نتیجه</th>
            <th class="px-4 py-3 text-right font-bold">اعتبار</th>
            <th class="px-4 py-3 text-right font-bold">زمان</th>
          </tr>
        </thead>
        <tbody>
          ${logs.map(l => `
            <tr class="border-t border-slate-100">
              <td class="px-4 py-3 font-mono font-bold" dir="ltr">${l.ticket_serial || '—'}</td>
              <td class="px-4 py-3 font-mono text-xs" dir="ltr">${l.device_id}</td>
              <td class="px-4 py-3">
                <span class="badge ${l.result === 'valid' ? 'badge-green' : 'badge-red'}">${l.result}</span>
              </td>
              <td class="px-4 py-3 text-xs">${l.credits_before} → ${l.credits_after}</td>
              <td class="px-4 py-3 text-xs text-slate-500">${fmtDate(l.scanned_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${logs.length === 0 ? '<div class="text-center py-12 text-slate-400">لاگی وجود ندارد</div>' : ''}
    </div>
  `;

  const cb = document.getElementById('autoRefresh');
  let interval;
  cb.addEventListener('change', () => {
    if (cb.checked) {
      interval = setInterval(() => { if (state.currentPage === 'scans') renderScans(); }, 10000);
    } else clearInterval(interval);
  });
}

// ============= FILTER =============
function filterTable(tableId) {
  const search = document.getElementById(tableId === 'ordersTable' ? 'orderSearch' : 'ticketSearch').value.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(search) ? '' : 'none';
  });
}

// ============= INIT =============
(function init() {
  if (state.token) {
    api('admin.stats')
      .then(() => showDashboard())
      .catch(() => {
        state.token = '';
        localStorage.removeItem('funpark_admin_token');
      });
  }
})();
</script>
